<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portal de Calidad · El Pedregal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* tokens: rojo Pedregal, neutros calidos, tarjetas por categoria */
:root{--bg:#f6f3f1;--card:#ffffff;--fg:#1f1a19;--mut:#6e625e;--line:#e4dbd7;--acc:#c8102e;--accs:#fbe8ea;
  --ff:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141112;--card:#1e1a1b;--fg:#f2ece9;--mut:#a89f9b;--line:#332c2d;--acc:#ff5a6e;--accs:#3a1a20;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ff)}
.w{max-width:1100px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
.hd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:18px;color:#fff;border-radius:16px;padding:18px 28px;
  background:linear-gradient(100deg,#c8102e 0%,#a3112a 45%,#5e0d18 100%);box-shadow:0 8px 24px rgba(200,16,46,.22)}
.mk{display:flex;align-items:center;gap:12px}.wm{font:700 2rem/1 Georgia,"Times New Roman",serif}.tg{font:italic 600 .8rem Georgia,serif;text-align:right;opacity:.95}
.ttl{text-align:center}.ttl h1{margin:0;font-size:clamp(1.2rem,2.6vw,1.9rem);font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.ttl p{margin:4px 0 0;opacity:.9;font-size:.92rem}.hd .n{text-align:right;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}.hd .n b{display:block;font-size:1.6rem;letter-spacing:0}
@media(max-width:720px){.hd{grid-template-columns:1fr;text-align:center}.mk{justify-content:center}.hd .n{text-align:center}}
.bus{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.bus input{flex:1;border:0;background:transparent;color:var(--fg);font:500 1rem var(--ff);outline:none;min-width:0}
.bus:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--accs)}
.cat h2{margin:0 0 10px;font-size:.8rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:8px}
.cat h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px}
.c{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:inherit;
  transition:transform .15s,border-color .15s,box-shadow .15s}
.c:hover,.c:focus-visible{border-color:var(--acc);box-shadow:0 8px 22px rgba(200,16,46,.14);transform:translateY(-2px);outline:none}
.top{display:flex;align-items:center;gap:12px}.ic{width:46px;height:46px;border-radius:12px;background:var(--accs);color:var(--acc);display:grid;place-items:center;flex:0 0 auto}
.c h3{margin:0;font-size:1.1rem;font-weight:800}.c p{margin:0;color:var(--mut);font-size:.9rem;line-height:1.45}
.ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.who{font-size:.75rem;color:var(--mut)}.go{font-weight:700;font-size:.88rem;color:#fff;background:var(--acc);border-radius:99px;padding:6px 14px;white-space:nowrap}
.tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:2px}
.vacio{color:var(--mut);text-align:center;padding:20px}
.pie{color:var(--mut);font-size:.78rem;text-align:center}
@media (prefers-reduced-motion:reduce){.c{transition:none}.c:hover{transform:none}}
</style>
</head>
<body>
<div class="w">
<header class="hd">
 <div class="mk"><div><div class="wm">Pedregal</div><div class="tg">the fruit company</div></div>
  <svg width="40" height="50" viewBox="0 0 48 60" aria-hidden="true"><path d="M24 3v7M24 7c4-4 9-4 13-1" stroke="#9fd45a" stroke-width="3" fill="none" stroke-linecap="round"/><g fill="#9fd45a" stroke="#5f9e2c" stroke-width="1.2"><circle cx="13" cy="17" r="6"/><circle cx="24" cy="16" r="6"/><circle cx="35" cy="17" r="6"/><circle cx="18" cy="27" r="6"/><circle cx="30" cy="27" r="6"/><circle cx="12" cy="37" r="6"/><circle cx="24" cy="37" r="6"/><circle cx="36" cy="37" r="6"/><circle cx="18" cy="47" r="6"/><circle cx="30" cy="47" r="6"/><circle cx="24" cy="55" r="5"/></g></svg></div>
 <div class="ttl"><h1>Portal de Calidad</h1><p>Todas las plataformas y reportes en un solo lugar</p></div>
 <div class="n">Accesos<b id="cuantos">0</b></div>
</header>
<label class="bus" for="q"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
 <input id="q" type="search" placeholder="Buscar: brix, clima, cosecha…" autocomplete="off"></label>
<main id="lista"></main>
<p class="pie">El Pedregal · Control de Calidad · Campaña 2026 - 2027</p>
</div>
<script>
/* ======== PARA AGREGAR UN LINK: copia una linea y cambia sus datos ======== */
const LINKS = [
  {cat: "Cosecha",  nombre: "Plataforma Pedregal",  link: "https://pedregal-plataforma-alujrdjrppbbp5onwmnvrh.streamlit.app",
   desc: "Calidad de cosecha por lote: limpieza, brix, pesos, descarte, directorio", quien: "Gerencia, calidad", orden: 1},
  {cat: "Reportes", nombre: "Reporte de Brix",      link: "https://brix-pedregal.streamlit.app/",
   desc: "DDC, seguimiento de brix y seguimiento de calibre", quien: "Gerencia, calidad", orden: 2},
  {cat: "Clima",    nombre: "Datos meteorológicos", link: "https://datosmeteorologico-nappgybsupiymp6tcqz2aac.streamlit.app/",
   desc: "Estación meteorológica DAVIS", quien: "Gerencia, calidad", orden: 3},
  {cat: "Riego y Nutrición", nombre: "Datos Foliares", link: "https://script.google.com/a/macros/elpedregalsa.com/s/AKfycbw3uu1EAbq0yPFrdasThO9EgKlmUO0HMXqEZyJ0HxhDG-xdTHhdMFf8Iq_r_FJatE_WDw/exec",
   desc: "Análisis foliares por lote", quien: "Gerencia, riego y nutrición", orden: 4},
  {cat: "Residuos Químicos", nombre: "Residuos Químicos", link: "https://script.google.com/a/macros/elpedregalsa.com/s/AKfycbxOg5LUNc61IF10ao4qz1I9jQ2D-lJ7EpFemg22eEyZvAXthBf8a537zF5aeRcG1LwEnQ/exec",
   desc: "Resultados de análisis de residuos químicos", quien: "Gerencia, calidad", orden: 5},{cat: "Aplicación AG3", nombre: "Giberelico", link: "https://giberelico-mazwxmktxu49zds9lpaq9n.streamlit.app/",
   desc: "Detalle de aplicaciones por etapa", quien: "Gerencia, calidad", orden: 6},
];
/* ========================================================================== */
const ICON = {
  Cosecha: '<path d="M12 2v3M12 3.5c1.6-1.4 3.6-1.4 5-.5"/><circle cx="8" cy="9" r="2.6"/><circle cx="13" cy="9" r="2.6"/><circle cx="10.5" cy="13.5" r="2.6"/><circle cx="15.5" cy="13.5" r="2.6"/><circle cx="13" cy="18" r="2.6"/>',
  Packing: '<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/>',
  Reportes:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  Clima:   '<circle cx="8" cy="9" r="3"/><path d="M8 2v2M2 9h2M3.8 4.8l1.4 1.4M12.2 4.8l-1.4 1.4"/><path d="M9 20h9a4 4 0 0 0 0-8 5 5 0 0 0-9.5 1.5A3.3 3.3 0 0 0 9 20z"/>',
  Campo:   '<path d="M3 20h18M6 20V10l6-5 6 5v10"/><path d="M10 20v-5h4v5"/>',
  Formularios:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  Carpetas:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  "Riego y Nutrición": '<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/><path d="M9 15a3 3 0 0 0 3 3"/>',
  "Residuos Químicos": '<path d="M9 3h6M10 3v6L5 18a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/>',
  Otros:   '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>'
};
const ic = c => `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[c] || ICON.Otros}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const sinTilde = s => String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
function pinta(){
  const q = sinTilde(document.getElementById('q').value.trim());
  const items = LINKS.filter(l => !q || sinTilde([l.cat,l.nombre,l.desc,l.quien].join(' ')).includes(q))
                     .sort((a,b) => (a.orden ?? 99) - (b.orden ?? 99));
  document.getElementById('cuantos').textContent = LINKS.length;
  document.getElementById('lista').innerHTML = items.length ? `<div class="grid">${items.map(l => `<a class="c" href="${esc(l.link)}" target="_blank" rel="noopener">
      <div class="top"><div class="ic">${ic(l.cat)}</div><div><span class="tag">${esc(l.cat)}</span><h3>${esc(l.nombre)}</h3></div></div>
      <p>${esc(l.desc)}</p><div class="ft"><span class="who">${l.quien ? 'Para: ' + esc(l.quien) : ''}</span><span class="go">Abrir ↗</span></div></a>`).join('')}</div>`
    : '<p class="vacio">No hay accesos con esa búsqueda.</p>';
}
document.getElementById('q').addEventListener('input', pinta);
pinta();
</script>
</body>
</html>
